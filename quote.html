<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Quote — JT CNF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f7f6; color: #333; line-height: 1.6; }
    
    header { background-color: #0f2b46; color: white; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 24px; }
    nav ul { list-style: none; display: flex; gap: 20px; align-items: center; }
    nav a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; }
    nav a:hover { color: #f39c12; }
    .nav-btn { background-color: #f39c12; color: white !important; padding: 8px 15px; border-radius: 5px; }
    
    .page-title { background-color: #0a1c2e; color: white; text-align: center; padding: 60px 20px; }
    .page-title h2 { font-size: 36px; margin-bottom: 10px; }
    
    .form-container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .form-group textarea { height: 100px; }
    .form-row { display: flex; gap: 20px; }
    .form-row .form-group { flex: 1; }
    .submit-btn { background-color: #f39c12; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; margin-top: 10px;}

    footer { background-color: #0a1c2e; color: #aaa; text-align: center; padding: 30px 20px; font-size: 14px; margin-top: 50px; }
    
    @media (max-width: 768px) {
      header { flex-direction: column; gap: 15px; padding: 20px; }
      nav ul { flex-wrap: wrap; justify-content: center; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

  <header>
    <h1>JT CNF</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact Us</a></li>
        <li><a href="quote.html" class="nav-btn">Get a Quote</a></li>
      </ul>
    </nav>
  </header>

  <section class="page-title">
    <h2>Request a Quote</h2>
    <p>Tell us about your shipment and we will get back to you with a quotation.</p>
  </section>

  <section class="form-container">
    <form action="#" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label>Company / Your Name *</label>
          <input type="text" required placeholder="Enter your name or company">
        </div>
        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" required placeholder="Enter your phone number">
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email (optional)">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Required Service *</label>
          <select required>
            <option value="">Select a service</option>
            <option>Import Customs Clearance</option>
            <option>Export Customs Clearance</option>
            <option>Air Cargo Clearance</option>
            <option>Sea Cargo Clearance</option>
            <option>Freight Coordination</option>
          </select>
        </div>
        <div class="form-group">
          <label>Air or Sea *</label>
          <select required>
            <option value="">Select type</option>
            <option>Air</option>
            <option>Sea</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Origin</label>
          <input type="text" placeholder="e.g., China, Dubai">
        </div>
        <div class="form-group">
          <label>Destination</label>
          <input type="text" placeholder="e.g., Dhaka, Chattogram">
        </div>
      </div>
      <div class="form-group">
        <label>Additional Notes</label>
        <textarea placeholder="Any special requirements..."></textarea>
      </div>
      <button type="submit" class="submit-btn">Submit Quote Request</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2024 M/S. Jamuna Trader's (JT CNF). All Rights Reserved.</p>
  </footer>

</body>
</html>
