<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Quote — JT CNF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f7f6; color: #333; line-height: 1.6; }
    
    header { background-color: #0f2b46; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 24px; white-space: nowrap; }
    nav ul { list-style: none; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    nav a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; }
    nav a:hover, nav a.active { color: #f39c12; }
    .nav-btn { background-color: #f39c12; color: white !important; padding: 8px 15px; border-radius: 5px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .action-btn { color: white; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 4px; border: 1px solid #2a4a6b; background-color: #1a3a5c; }
    .whatsapp { background-color: #25D366; border-color: #25D366; }

    .page-title { background-color: #0a1c2e; color: white; text-align: center; padding: 60px 20px; }
    .form-container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 8px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .form-row { display: flex; gap: 20px; }
    .form-row .form-group { flex: 1; }
    .submit-btn { background-color: #f39c12; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 18px; }
    footer { background-color: #0a1c2e; color: #aaa; text-align: center; padding: 30px 20px; font-size: 14px; margin-top: 50px; }
    
    @media (max-width: 1024px) {
      header { flex-direction: column; gap: 15px; padding: 15px; }
      .header-actions { width: 100%; justify-content: center; margin-top: 10px; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

  <header>
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
      <img src="logo.png" alt="JT CNF Logo" style="height: 45px; border-radius: 50%; background: white;">
      <div style="display: flex; flex-direction: column; line-height: 1.2;">
        <span style="font-size: 20px; font-weight: bold; letter-spacing: 1px;">JAMUNA TRADERS</span>
        <span style="font-size: 11px; color: #f39c12; font-weight: bold;">Customs Clearing & Forwarding</span>
      </div>
    </div><h1>JT CNF</h1></div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="quote.html" class="nav-btn active">Get a Quote</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a href="mailto:jtcnf.bd@gmail.com" class="action-btn">✉️ Email</a>
      <a href="https://wa.me/8801811470616" target="_blank" class="action-btn whatsapp">💬 WhatsApp</a>
      <a href="#" class="action-btn">📄 Company Profile</a>
    </div>
  </header>

  <section class="page-title">
    <h2>Request a Quote</h2>
    <p>Tell us about your shipment.</p>
  </section>

  <section class="form-container">
    <form id="quoteForm">
      <div class="form-row">
        <div class="form-group"><label>Company / Name *</label><input type="text" id="qName" required></div>
        <div class="form-group"><label>Phone *</label><input type="tel" id="qPhone" required></div>
      </div>
      <div class="form-group"><label>Email</label><input type="email" id="qEmail"></div>
      <div class="form-row">
        <div class="form-group"><label>Service *</label>
          <select id="qService" required>
            <option value="">Select</option>
            <option>Import Customs Clearance</option>
            <option>Export Customs Clearance</option>
            <option>Air Cargo Clearance</option>
            <option>Sea Cargo Clearance</option>
          </select>
        </div>
        <div class="form-group"><label>Air / Sea *</label>
          <select id="qType" required><option value="">Select</option><option>Air</option><option>Sea</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Origin</label><input type="text" id="qOrigin" placeholder="e.g., China"></div>
        <div class="form-group"><label>Destination</label><input type="text" id="qDest" placeholder="e.g., Dhaka"></div>
      </div>
      <div class="form-group"><label>Additional Notes</label><textarea id="qNotes"></textarea></div>
      <button type="submit" class="submit-btn">Send Quote Request</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2024 M/S. Jamuna Trader's (JT CNF). All Rights Reserved.</p>
  </footer>

  <script>
    document.getElementById('quoteForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var name = document.getElementById('qName').value;
      var phone = document.getElementById('qPhone').value;
      var email = document.getElementById('qEmail').value;
      var service = document.getElementById('qService').value;
      var type = document.getElementById('qType').value;
      var origin = document.getElementById('qOrigin').value;
      var dest = document.getElementById('qDest').value;
      var notes = document.getElementById('qNotes').value;
      var subject = encodeURIComponent('Quote Request: ' + service + ' - ' + name);
      var body = encodeURIComponent(
        'Name/Company: ' + name + '\n' +
        'Phone: ' + phone + '\n' +
        'Email: ' + email + '\n' +
        'Service: ' + service + '\n' +
        'Air/Sea: ' + type + '\n' +
        'Origin: ' + origin + '\n' +
        'Destination: ' + dest + '\n\n' +
        'Notes:\n' + notes
      );
      window.location.href = 'mailto:jtcnf.bd@gmail.com?subject=' + subject + '&body=' + body;
    });
  </script>
</body>
</html>
